<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal ASJ — Acesso ao Catálogo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  background:linear-gradient(145deg,#061a3a 0%,#0c4cae 55%,#1a5fd4 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;
}

/* Card */
.card{
  background:#fff;border-radius:20px;
  padding:44px 40px 36px;
  width:100%;max-width:400px;
  box-shadow:0 28px 80px rgba(0,0,0,.38);
  animation:fadeUp .35s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* Logo */
.logo{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.logo b{font-size:28px;color:#081f45;letter-spacing:-.5px}
.logo span{font-size:13px;color:#00a3e0;font-weight:700;letter-spacing:.3px}

.badge{
  display:inline-block;background:#e8f0fc;color:#0c4cae;
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 12px;border-radius:99px;margin-bottom:28px;margin-top:8px;
}

h2{font-size:19px;font-weight:800;color:#081f45;margin-bottom:22px}

/* Divider */
.divider{height:1px;background:#eef0f5;margin-bottom:24px}

/* Fields */
.field{margin-bottom:16px}
.field label{
  display:block;font-size:11.5px;font-weight:700;
  color:#64647a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;
}
.input-wrap{position:relative}
.input-wrap svg{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  opacity:.35;pointer-events:none;
}
.field input{
  width:100%;padding:12px 14px 12px 40px;
  border:1.5px solid #dce1eb;border-radius:10px;
  font-size:16px;color:#1a1a2e;outline:none;
  transition:border-color .15s,box-shadow .15s;background:#fafbfc;
}
.field input:focus{
  border-color:#0c4cae;background:#fff;
  box-shadow:0 0 0 3px rgba(12,76,174,.1);
}

/* Button */
.btn-login{
  width:100%;padding:14px;margin-top:6px;
  background:#0c4cae;color:#fff;
  border:none;border-radius:10px;
  font-size:15px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:background .15s,transform .1s;
}
.btn-login:hover:not(:disabled){background:#1a5fd4;transform:translateY(-1px)}
.btn-login:active{transform:none}
.btn-login:disabled{background:#9ab0d4;cursor:not-allowed}

/* Spinner */
.spinner{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .65s linear infinite;display:none;flex-shrink:0;
}
.spinner.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error */
.error-msg{
  display:none;background:#fff0f0;color:#c62828;
  border:1px solid #ffcdd2;border-radius:9px;
  padding:11px 14px;font-size:13px;font-weight:600;
  margin-top:14px;text-align:center;
}
.error-msg.show{display:block}

/* Footer links */
.card-footer{margin-top:26px;text-align:center}
.card-footer a{
  font-size:13px;color:#9ab0d4;text-decoration:none;
  transition:color .15s;
}
.card-footer a:hover{color:#0c4cae}

/* Bottom text */
.page-footer{
  margin-top:24px;font-size:12px;
  color:rgba(255,255,255,.45);text-align:center;
}

@media(max-width:440px){
  .card{padding:32px 22px 28px;border-radius:16px}
  .logo b{font-size:24px}
}
</style>
</head>
<body>

<div class="card">
  <div class="logo"><b>ASJ</b><span>Tecnologia</span></div>
  <div class="badge">Área Exclusiva de Parceiros</div>

  <div class="divider"></div>

  <h2>Acesse o Catálogo</h2>

  <form id="loginForm" autocomplete="off" novalidate>
    <div class="field">
      <label for="usuario">Usuário</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <input type="text" id="usuario" name="usuario" placeholder="Seu usuário" autocomplete="username" required>
      </div>
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
      </div>
    </div>

    <button class="btn-login" type="submit" id="btnLogin">
      <span id="btnText">Entrar no Catálogo</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="error-msg" id="errorMsg"></div>
  </form>

  <div class="card-footer">
    <a href="index.html">← Voltar ao site ASJ</a>
  </div>
</div>

<p class="page-footer">ASJ Tecnologia Agrícola — Acesso restrito a parceiros</p>

<script>
// ─── CONFIGURAÇÃO ─────────────────────────────────────────────────────────────
// Cole aqui a URL gerada ao publicar o Apps Script como Web App
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzxSa08Tl7Cu-ah_8eM9n9WL01PenAWJdr2HrmE4dxlUdE0sBgJfBLodVQeoykEh50Q4Q/exec';

// ─── SE JÁ ESTÁ LOGADO, VAI DIRETO PRO CATÁLOGO ──────────────────────────────
(function () {
  try {
    const s = sessionStorage.getItem('asj_portal');
    if (s) {
      const d = JSON.parse(s);
      if (d.nome && d.ts) {
        window.location.replace('catalogo.html');
      }
    }
  } catch (e) { sessionStorage.removeItem('asj_portal'); }
})();

// ─── SUBMIT ───────────────────────────────────────────────────────────────────
document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();

  const usuario = document.getElementById('usuario').value.trim();
  const senha   = document.getElementById('senha').value;
  const btn     = document.getElementById('btnLogin');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btnText');
  const errMsg  = document.getElementById('errorMsg');

  if (!usuario || !senha) {
    mostrarErro('Preencha usuário e senha.');
    return;
  }

  btn.disabled = true;
  btnText.textContent = 'Aguarde...';
  spinner.classList.add('show');
  errMsg.classList.remove('show');

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      // Content-Type text/plain evita preflight CORS no Apps Script
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'login', usuario, senha })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();

    if (data.ok) {
      sessionStorage.setItem('asj_portal', JSON.stringify({
        usuario : usuario,
        nome    : data.nome,
        empresa : data.empresa,
        ts      : Date.now()
      }));
      window.location.replace('catalogo.html');
    } else {
      mostrarErro(data.msg || 'Usuário ou senha incorretos.');
    }
  } catch (err) {
    mostrarErro('Erro de conexão. Verifique e tente novamente.');
  } finally {
    btn.disabled = false;
    btnText.textContent = 'Entrar no Catálogo';
    spinner.classList.remove('show');
  }
});

function mostrarErro(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}
</script>
</body>
</html>
